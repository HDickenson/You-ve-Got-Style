<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Home: Impact Reveal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Inter:wght@300;400&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            onyx: '#111111',
            gold: '#C8A66B',
          },
          fontFamily: {
            playfair: ['"Playfair Display"', 'serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styles">body {
    background-color: #111;
    color: #fff;
    font-family: "Inter", sans-serif;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    /* Prevent scrolling for full-screen immersive feel */
    }
.hero-image {
    /* Simulating the full bleed image from the design */
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuANJ6n3nhvPY61sO8Ps61es1E1zABhbzkhNY2DBG7_7nt6yK-JOQpTRVlLzouaV8daAF3Qco4aeJi63UPAB0pj6LyIdvF_N5n2oGzG2j4cEjhn-Wskujjt8f6JvzK1l4hwXuyrWHNl6fXCSLQI731d68Qy8qA05Tw6YV0z-1EKBRj4oadxwhzM6AEYag-gCTzjjr8eTF9K446Xqd_tRspufh295ql8drkArFZFhvLCj8VSO54a9gxLdfA);
    background-size: cover;
    background-position: center
    }
/* Gradient overlay to ensure text readability */
.hero-overlay {
    background: linear-gradient(to top, rgba(17, 17, 17, 1) 15%, rgba(17, 17, 17, 0.4) 50%, rgba(17, 17, 17, 0) 100%)
    }</style>
</head>
<body class="antialiased text-white flex justify-center bg-black">
<!-- BEGIN: Mobile App Container -->
<!-- Container simulating a mobile device screen for preview purposes -->
<div class="relative w-full max-w-[430px] h-[932px] max-h-screen bg-onyx overflow-hidden shadow-2xl flex flex-col">
<!-- BEGIN: Hero Section -->
<main class="flex-grow relative w-full h-full hero-image" data-purpose="hero-section">
<!-- Top Gradient for Status Bar visibility -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-onyx/80 to-transparent pointer-events-none z-10"></div>
<!-- Bottom Overlay for Content Readability -->
<div class="absolute inset-x-0 bottom-0 h-[60%] hero-overlay pointer-events-none z-10"></div>
<!-- BEGIN: Header / Top Navigation -->
<header class="absolute top-0 inset-x-0 px-6 pt-14 pb-4 flex justify-between items-center z-20" data-purpose="top-navigation">
<!-- Logo -->
<div class="text-2xl font-playfair tracking-widest text-white/90">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 21V12M12 12L5 5M12 12L19 5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<!-- Hamburger Menu -->
<button aria-label="Menu" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center bg-black/20 backdrop-blur-md">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
</button>
</header>
<!-- END: Header / Top Navigation -->
<!-- BEGIN: Content Area -->
<div class="absolute bottom-32 inset-x-0 px-8 z-20 flex flex-col gap-4" data-purpose="hero-content">
<h1 class="font-playfair text-4xl md:text-5xl leading-[1.1] tracking-wide font-normal">
          STYLE THAT<br/>
          UNDERSTANDS<br/>
<span class="text-gold italic font-light">YOU</span>
</h1>
<p class="font-inter text-sm md:text-base font-light text-white/70 leading-relaxed max-w-[280px] mt-2">
          AI-driven style intelligence<br/>
          that gets to know you and<br/>
          brings out your best.
        </p>
</div>
<!-- END: Content Area -->
</main>
<!-- END: Hero Section -->
<!-- BEGIN: Bottom Navigation Bar -->
<nav class="absolute bottom-0 inset-x-0 h-32 px-8 flex justify-between items-end pb-8 z-30" data-purpose="bottom-navigation">
<!-- My Looks Button -->
<button aria-label="My Looks" class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full border border-white/20 flex items-center justify-center transition-colors group-hover:bg-white/10">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4C10.8954 4 10 4.89543 10 6C10 7.10457 10.8954 8 12 8C13.1046 8 14 7.10457 14 6C14 4.89543 13.1046 4 12 4Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"></path>
<path d="M12 8L4 16H20L12 8Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"></path>
</svg>
</div>
<span class="text-[10px] font-inter tracking-widest text-white/60 uppercase">My Looks</span>
</button>
<!-- Style Me Orb (Primary Action) -->
<button aria-label="Style Me" class="flex flex-col items-center gap-2 -translate-y-4">
<div class="w-20 h-20 rounded-full bg-gold shadow-[0_0_30px_rgba(200,166,107,0.3)] flex items-center justify-center transition-transform hover:scale-105">
<svg class="text-onyx" fill="none" height="28" viewbox="0 0 24 24" width="28" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3V21M3 12H21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
<path d="M16.2426 7.75736L7.75736 16.2426M16.2426 16.2426L7.75736 7.75736" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<span class="text-[10px] font-inter tracking-widest text-white/90 uppercase font-medium mt-1">Style Me</span>
</button>
<!-- Menu Button -->
<button aria-label="Menu" class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full border border-white/20 flex items-center justify-center transition-colors group-hover:bg-white/10">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<rect height="8" rx="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" width="10" x="7" y="11"></rect>
<path d="M9 11V8C9 6.34315 10.3431 5 12 5C13.6569 5 15 6.34315 15 8V11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"></path>
</svg>
</div>
<span class="text-[10px] font-inter tracking-widest text-white/60 uppercase">Menu</span>
</button>
</nav>
<!-- END: Bottom Navigation Bar -->
<!-- Home Indicator -->
<div class="absolute bottom-2 inset-x-0 flex justify-center z-40 pointer-events-none">
<div class="w-1/3 h-1 bg-white/30 rounded-full"></div>
</div>
</div>
<!-- END: Mobile App Container -->
</body></html>
