<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Camera Calibration &amp; Hands-Free Capture - ATELIER AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary-fixed": "#e5e2e1",
                        "inverse-surface": "#303031",
                        "on-secondary-fixed": "#1c1c19",
                        "on-tertiary-container": "#a17f3b",
                        "inverse-on-surface": "#f2f0f0",
                        "on-primary-fixed": "#1c1b1b",
                        "on-secondary-fixed-variant": "#474743",
                        "secondary-container": "#e5e2dd",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fbf9f8",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#444748",
                        "surface-container": "#efeded",
                        "surface": "#fbf9f8",
                        "outline-variant": "#c4c7c7",
                        "tertiary-container": "#261900",
                        "on-secondary-container": "#656461",
                        "on-surface": "#1b1c1c",
                        "surface-container-highest": "#e4e2e2",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#261900",
                        "on-background": "#1b1c1c",
                        "surface-container-high": "#e9e8e7",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f5f3f3",

                        "surface-container-lowest": "#ffffff",
                        "secondary": "#5f5e5b",
                        "primary": "#000000",
                        "on-primary-fixed-variant": "#474646",
                        "error-container": "#ffdad6",
                        "surface-dim": "#dbdad9",
                        "primary-fixed-dim": "#c8c6c5",

                        "secondary-fixed-dim": "#c8c6c2",
                        "error": "#ba1a1a",

                        "secondary-fixed": "#e5e2dd",
                        "on-tertiary-fixed-variant": "#5d4201",
                        "on-error": "#ffffff",
                        "primary-container": "#1c1b1b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-margin": "24px",
                        "unit": "4px",
                        "section-gap": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "display-lg": ["Playfair Display"],
                        "title-md": ["Hanken Grotesk"],
                        "headline-lg": ["Playfair Display"],
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Playfair Display"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { opacity: 0; transform: scale(1.5); }
        }
        .silhouette-glow {
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.4));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden relative font-body-lg text-body-lg">
<!-- Top Navigation Anchor (Shared Component mapped) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-container-margin h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline/10 scale-95 active:duration-150">
<button class="hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full text-primary dark:text-on-primary">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-display-lg text-display-lg uppercase tracking-widest text-primary dark:text-on-primary text-center">ATELIER AI</div>
<button class="hover:opacity-70 transition-opacity flex items-center justify-center p-2 rounded-full text-primary dark:text-on-primary">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
</header>
<!-- Main Canvas: Live Camera View -->
<main class="absolute inset-0 z-0 h-full w-full">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 bg-cover bg-center h-full w-full" data-alt="A sleek, high-end fashion runway or minimal studio space acting as a live camera viewfinder. Soft, diffused overhead lighting casts gentle shadows. The aesthetic is clean, professional, and slightly desaturated, fitting a luxury brand's digital calibration tool." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCTbvOtmrQtYQtnLFnZll8vdxUAMKDrM4Vz-kpQttLarKN9IKLMrTzbztMjThF6z0uIC7vVrhBXnYpvCX-imBsZ5EblhkUbZ93jtAFL3ybxqA9VHkG03Gm2oCbjBzkRS6NsKCyyWgKERi28bdk9_JUlvS4sTxc4a_wnFLpRQH7b1XRxRaq-afy20Hbze_Az_eJ5syzH1ccQsZQG5KWWFihJCTyGNw-EIH7Ti7a6XU8aGNLh0gD401MeuQ')"></div>
<div class="absolute inset-0 bg-black/20"></div> <!-- Subtle darkening for UI contrast -->
<!-- AR Silhouette Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<!-- Added center reticle -->
<div class="absolute w-64 h-64 border-[0.5px] border-white/20 rounded-full flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-[#C5A059]/80"></div>
<div class="absolute w-full h-[0.5px] bg-white/20"></div>
<div class="absolute h-full w-[0.5px] bg-white/20"></div>
</div>
<svg class="w-2/3 h-2/3 max-h-[707px] text-white/30 silhouette-glow" fill="none" viewbox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
<!-- Abstract minimal fashion silhouette -->
<path d="M100 20 C120 20, 130 40, 130 60 C130 80, 110 90, 100 90 C90 90, 70 80, 70 60 C70 40, 80 20, 100 20 Z" stroke="currentColor" stroke-dasharray="2 4" stroke-width="1"></path>
<path d="M100 100 L140 120 L130 250 L100 380 L70 250 L60 120 Z" stroke="currentColor" stroke-dasharray="2 4" stroke-width="1"></path>
<path d="M60 120 L30 180 M140 120 L170 180" stroke="currentColor" stroke-dasharray="2 4" stroke-width="1"></path>
</svg>
</div>
<!-- Geometric Gauges (Pitch & Roll) -->
<!-- Vertical Gauge (Pitch) -->
<div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col items-center gap-3">
<span class="font-label-caps text-[10px] text-white/70 uppercase tracking-widest">Pitch</span>
<div class="w-px h-40 bg-white/20 relative flex items-center justify-center">
<!-- Ticks -->
<div class="absolute w-2 h-px bg-white/30 top-[20%]"></div>
<div class="absolute w-3 h-px bg-white/50 top-1/2"></div>
<div class="absolute w-2 h-px bg-white/30 top-[80%]"></div>
<!-- Indicator (Gold accent mapping) -->
<div class="absolute w-4 h-1 bg-[#C5A059] top-[40%] rounded-full transition-all duration-300 shadow-[0_0_8px_rgba(197,160,89,0.5)]"></div>
</div>
<span class="font-label-caps text-label-caps text-white font-bold tracking-widest">+2°</span>
</div>
<!-- Horizontal Gauge (Roll) -->
<div class="absolute bottom-40 left-1/2 -translate-x-1/2 flex flex-row items-center gap-5">
<span class="font-label-caps text-[10px] text-white/70 uppercase tracking-widest">Roll</span>
<div class="w-56 h-px bg-white/20 relative flex items-center justify-center">
<!-- Ticks -->
<div class="absolute h-2 w-px bg-white/30 left-[20%]"></div>
<div class="absolute h-3 w-px bg-white/50 left-1/2"></div>
<div class="absolute h-2 w-px bg-white/30 left-[80%]"></div>
<!-- Indicator -->
<div class="absolute h-4 w-1 bg-[#C5A059] left-[55%] rounded-full transition-all duration-300 shadow-[0_0_8px_rgba(197,160,89,0.5)]"></div>
</div>
<span class="font-label-caps text-label-caps text-white font-bold tracking-widest">-1°</span>
</div>
<!-- Alignment Status Indicator -->
<div class="absolute top-24 left-1/2 -translate-x-1/2 z-20">
<div class="backdrop-blur-xl bg-surface/80 dark:bg-surface-dim/80 px-6 py-2 rounded-full border-[0.5px] border-outline/10 shadow-sm flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-outline animate-pulse"></div>
<span class="font-label-caps text-label-caps uppercase text-primary tracking-widest">Awaiting Alignment</span>
</div>
</div>
</main>
<!-- Hands-Free Voice Capture Indicator -->
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex flex-col items-center z-20">
<div class="relative flex items-center justify-center w-20 h-20 mb-3">
<!-- Pulsing rings -->
<div class="absolute inset-0 rounded-full border border-primary/30 pulse-animation"></div>
<div class="absolute inset-0 rounded-full border border-primary/20 pulse-animation" style="animation-delay: 0.5s;"></div>
<!-- Mic Icon -->
<div class="bg-surface/90 backdrop-blur-md rounded-full w-14 h-14 flex items-center justify-center border-[0.5px] border-outline/20 text-primary shadow-lg">
<span class="material-symbols-outlined text-[28px]" data-icon="mic_external_on">mic_external_on</span>
</div>
</div>
<div class="bg-black/40 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/10">
<span class="font-label-caps text-[13px] uppercase text-white tracking-[0.2em] font-bold drop-shadow-md">Say "Snap"</span>
</div>
</div>
</body></html>
