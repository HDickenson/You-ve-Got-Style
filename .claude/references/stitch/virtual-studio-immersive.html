<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Virtual Studio: Immersive</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#f5f5f0', // Off-white/cream
              dark: '#1a1a1a',  // Deep grey/black
              accent: '#d4af37', // Gold/brass tone
              overlay: 'rgba(0, 0, 0, 0.2)', // Semi-transparent black
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Inter"', 'Helvetica', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-styles">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Simulate Mobile Device Frame */
    .mobile-container {
      width: 100%;
      max-width: 430px; /* Standard iPhone Max width approx */
      height: 100vh;
      max-height: 932px; /* Standard iPhone Max height approx */
      margin: 0 auto;
      position: relative;
      background-color: #1a1a1a;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
    }
    
    @media (min-width: 431px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0a0a0a; /* Darker background outside the 'device' */
      }
      .mobile-container {
        border-radius: 40px; /* Rounded corners for device simulation */
        height: 90vh; /* Responsive height */
      }
    }
  </style>
<style data-purpose="hero-image">.hero-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDMWY8I2L6GZUy8AwEhwF621WrlNGIgC7rKcVVF8OJKp0u3sr0ZYtf2FS2Bk55r8f8QZ70Sq9l3oV6jrV5rcRFkZr1VGgp6ZDsmF5wodg3gyJjM0i5xlnJSTRJ2yijR5FSslgslGAILu2m7fFB5JMl0mUOy7rg6PCxrbf0L-bgTKKzwAPu3dw_AXiBQUj5UvTPn1lKFE8V8tHO72svLfr4pzz3xI8Oe_01gxEeWPLZzTCfrODrcTh6j0g);
    /* High fashion, moody placeholder */
    background-size: cover;
    background-position: center;
    z-index: 1
    }
.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.6) 100%);
    z-index: 2
    }</style>
<style data-purpose="ui-elements">
    .ui-layer {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      transition: all 0.3s ease;
    }

    .nav-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    .action-btn-small {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
    }

    .action-btn-large {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background-color: #f5f5f0; /* Off-white orb */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .indicator-dots {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .dot.active {
      background-color: #d4af37; /* Gold active dot */
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }
  </style>
</head>
<body>
<!-- BEGIN: Mobile App Container -->
<main class="mobile-container">
<!-- Background Imagery -->
<div aria-hidden="true" class="hero-bg"></div>
<div aria-hidden="true" class="hero-overlay"></div>
<!-- UI Overlay Layer -->
<div class="ui-layer">
<!-- BEGIN: Top Navigation -->
<header class="flex justify-between items-start pt-8 pb-4">
<!-- Logo 'Y' Mark -->
<div class="text-4xl font-serif text-white tracking-wider">Y</div>
<!-- Hamburger Menu -->
<button aria-label="Menu" class="nav-btn">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: Top Navigation -->
<!-- Right Side Indicators (Carousel/Views) -->
<div aria-label="Image navigation" class="indicator-dots">
<div aria-current="step" class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
<!-- BEGIN: Bottom Controls -->
<footer class="pb-10 pt-20">
<div class="flex justify-between items-end px-4">
<!-- Change Look Button -->
<div class="flex flex-col items-center gap-3">
<button aria-label="Change Look" class="action-btn-small">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] tracking-widest uppercase text-white/80 font-medium">Change Look</span>
</div>
<!-- Ask Stylist (Hero Action) -->
<div class="flex flex-col items-center gap-4 -translate-y-4">
<button aria-label="Ask Stylist" class="action-btn-large">
<svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] tracking-widest uppercase text-white font-semibold">Ask Stylist</span>
</div>
<!-- Menu Button -->
<div class="flex flex-col items-center gap-3">
<button aria-label="Secondary Menu" class="action-btn-small">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] tracking-widest uppercase text-white/80 font-medium">Menu</span>
</div>
</div>
<!-- Home Indicator (iOS simulation) -->
<div class="w-1/3 h-1 bg-white/50 rounded-full mx-auto mt-8"></div>
</footer>
<!-- END: Bottom Controls -->
</div>
</main>
<!-- END: Mobile App Container -->
</body></html>
