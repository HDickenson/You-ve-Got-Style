<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            80% {
                transform: scale(1.5);
                opacity: 0;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .pulse-effect::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid theme('colors.tertiary-fixed-dim');
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<div class="absolute top-6 left-6 z-50 pointer-events-none opacity-40">
<span class="font-headline-lg italic text-3xl text-primary">Y</span>
</div>
<!-- 80% Virtual Studio Canvas (Simulated with image for now, ideally WebGL) -->
<main class="relative flex-grow h-[80vh] w-full overflow-hidden bg-surface-container">

<!-- Gradient overlay to blend into bottom section -->
<div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-[#FAF6F1] to-transparent pointer-events-none"></div>
</main>
<!-- 20% Discovery UI (Bottom Swipable Area) -->
<section class="h-[20vh] w-full bg-[#FAF6F1] relative z-30 pb-32 flex flex-col justify-end">
<div class="w-full overflow-x-auto hide-scrollbar pl-container-margin pr-container-margin pb-container-margin flex gap-gutter snap-x snap-mandatory">
<!-- Discovery Card 1 -->
<article class="snap-center shrink-0 w-72 md:w-96 bg-white rounded-xl p-4 shadow-sm border border-outline/10 flex items-center gap-4 cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="w-16 h-16 rounded-lg overflow-hidden shrink-0 bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A close-up fashion photography shot of a tailored women's blazer in a sophisticated camel tone. The image is bright, high-key, and meticulously lit, fitting a premium light-mode digital atelier aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0rVe6XXVIGsG0wxnRYOhNHj6ETLYWRENhHwh7eva02EechubFV-IRtVNRJjlsplsT1WGkLcZXBt6XlXG2wxgd2TeYWwxkyKLEKq0fcPj0oLh-dEuknZiF1HPtxX3AbIk7Fm6QdaoXXSccAhM8Q9-HU7uX-ZiCUp5Ku05Ae_uDi1XjmbIbHm7GLR8JUZnLccFzc9mpO7cX2qVDXjC1nYNGHD8K-wUERxMoe7CCAH9_uPArksPfQAQ_Gg"/>
</div>
<div class="flex-grow">

<p class="font-body-sm text-sm text-on-surface-variant line-clamp-1 mt-1">Curated styling for executive presence.</p>
</div>
<span class="material-symbols-outlined text-outline shrink-0">arrow_forward_ios</span>
</article>
<!-- Discovery Card 2 (Partial Preview to imply scroll) -->
<article class="snap-center shrink-0 w-72 md:w-96 bg-white rounded-xl p-4 shadow-sm border border-outline/10 flex items-center gap-4 cursor-pointer hover:bg-surface-container-low transition-colors opacity-60">
<div class="w-16 h-16 rounded-lg overflow-hidden shrink-0 bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A minimalist still life of luxury accessories, including a classic watch and a subtle silk scarf, arranged neatly on a pristine white marble surface. High-key lighting, cream and white palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBE2gtogFyESwf2r3MUjZhlTt5BVS6SJwoQv0ksIOI3L30b1x8fSTouQb8CyT8icYHizoQ1374J-7PtJEDFxgUvuqR5BHzQZUseYkY9rudkakiQQHS8og-AjGhxJ1dSdHwNLD7pdodKl8ciV4EhmK8f1pSBM8_4Z8o7x-IrPSLBGtNTQpMFjxWc-nouh4VDMp_ZqCIr1fFE1OWNKu_22fGIi4jG2DUr8TJr3BOd1yrxLGyhKy0tnxXUkw"/>
</div>

<p class="font-body-sm text-sm text-on-surface-variant line-clamp-1 mt-1">Elegant eveningwear selection.</p>
</div>
<span class="material-symbols-outlined text-outline shrink-0">arrow_forward_ios</span>

</div>

<!-- Contextual Thumb Zone Navigation -->
<nav class="absolute bottom-8 left-0 right-0 z-50 flex justify-between items-end px-8 md:px-12 pointer-events-none">
<!-- Change Look -->

<span class="material-symbols-outlined text-2xl font-light">swap_horiz</span>
<span class="font-label-caps text-xs tracking-widest uppercase">Change Look</span>
</button>
<!-- 'Style Me' Action Orb -->

<span class="font-headline-lg italic text-3xl text-tertiary-container group-hover:text-primary transition-colors leading-none">Y</span>
<span class="font-label-caps text-[10px] tracking-widest uppercase text-tertiary-container group-hover:text-primary leading-none">Style Me</span>
</button>
<!-- Menu -->
<button class="pointer-events-auto flex flex-col items-center gap-2 text-primary/70 hover:text-primary transition-colors tap-highlight-none pb-2">
<span class="material-symbols-outlined text-2xl font-light">menu</span>
<span class="font-label-caps text-xs tracking-widest uppercase">Menu</span>
</button>
