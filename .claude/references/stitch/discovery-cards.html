<script>
        // Basic swipe interaction stub for demonstration
        const card = document.getElementById('active-card');
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        card.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            card.style.transition = 'none';
        }, {passive: true});

        card.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX - startX;
            const rotation = currentX * 0.03; // reduced rotation for full screen
            card.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;
        }, {passive: true});

        card.addEventListener('touchend', () => {
            isDragging = false;
            card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            if (Math.abs(currentX) > 100) {
                // Swipe away
                const direction = currentX > 0 ? 1 : -1;
                card.style.transform = `translateX(${direction * 500}px) rotate(${direction * 20}deg)`;
                card.style.opacity = '0';
                // Reset after animation for demo loop
                setTimeout(() => {
                    card.style.transition = 'none';
                    card.style.transform = 'translateX(0) rotate(0)';
                    card.style.opacity = '1';
                }, 300);
            } else {
                // Snap back
                card.style.transform = 'translateX(0) rotate(0)';
            }
            currentX = 0;
        });
    </script>
