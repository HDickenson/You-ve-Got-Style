<style>

        }

            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        body {
            min-height: max(884px, 100dvh);
            background-color: #FAF6F1; /* Warm Cream */
        }

            box-shadow: 0 0 60px 20px rgba(255, 255, 255, 0.8), 0 10px 20px rgba(0, 0, 0, 0.05);
        }

<body class="text-on-surface font-body-lg h-full overflow-hidden flex flex-col relative selection:bg-surface-variant selection:text-on-surface">
<!-- Top Left Brand Mark -->
<header class="absolute top-12 left-6 z-50">
<h1 class="font-display-lg text-primary text-4xl leading-none">Y</h1>
</header>
<!-- Virtual Studio Canvas -->
<main class="relative flex-grow h-full w-full overflow-hidden">
<!-- 3D Digital Twin -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center object-cover" data-alt="A highly realistic, high-fidelity 3D digital twin rendering of a sophisticated professional Middle Eastern woman standing confidently in a minimalist, luxury interior space." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCvFTEylMpB2dlIihVq8XwRfoKX4qjNObB5vHFxMgyPhc5CBU9RDMIlpqmVkoSeeVqTUzZqHyNJdF3OoGh6v1kgm8wbHNxuPOIXBi3sQCjkljfkHH4xgkxDlmXL_1hEB6696GkC4cXICvIbN4UQUTKweF2OOejr_ntNQGRJHI3HObSqbIs67Gcr5otbYFIlXuGCcvsaii4kYBAjuOXmzBV5X-RT2RVwQON1ntIOQ1NCiwNBDLytjDtvqA'); background-position: top center;"></div>
<!-- Subtle gradient overlay at bottom for blending -->
<div class="absolute inset-x-0 bottom-0 h-64 bg-gradient-to-t from-[#FAF6F1] via-[#FAF6F1]/50 to-transparent pointer-events-none z-10"></div>
</main>
<!-- Primary Action Orb -->
<div class="absolute bottom-28 left-1/2 -translate-x-1/2 z-40">
<button class="relative w-32 h-32 bg-white rounded-full flex flex-col items-center justify-center text-primary orb-shadow tap-highlight-none hover:scale-105 transition-transform duration-300">
<span class="font-display-lg text-4xl mb-1">Y</span>
<span class="font-label-caps text-[10px] tracking-widest font-bold">STYLE ME</span>
</button>
</div>
<!-- Minimalist Bottom Navigation -->
<nav class="absolute bottom-0 w-full h-24 bg-[#EFEBE4]/90 backdrop-blur-xl flex justify-around items-center px-4 pb-safe pt-2 z-50 rounded-t-[2rem]">
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors tap-highlight-none group" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform font-light">home</span>
<span class="font-body-sm text-[11px]">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors tap-highlight-none group" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform font-light">person</span>
<span class="font-body-sm text-[11px]">Studio</span>
</a>
<a class="flex flex-col items-center justify-center text-primary transition-colors tap-highlight-none group" href="#">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform font-light">auto_awesome</span>

</a>

<span class="font-body-sm text-[11px]">Closet</span>
</a>

<span class="font-body-sm text-[11px]">Profile</span>
