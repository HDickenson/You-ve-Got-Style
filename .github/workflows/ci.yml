name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: '22'

jobs:
  type-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  impeccable-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node .claude/skills/impeccable/scripts/detect.mjs src/

  raw-hex-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-raw-hex.mjs

  # Every screen at 390x844, 820x1180 and 1180x820, plus one real click-through
  # journey — see scripts/capture.mjs. Blocking: a failed render, a phase the
  # journey can't reach, or a JS console error during either fails the job.
  responsive-captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-captures
          path: capture-output/
          if-no-files-found: ignore
